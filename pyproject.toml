[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
requires-python = ">=3.12"
build-backend = "setuptools.build_meta"

[project]
name = "task-tracker"
version = "0.1.0"
description = "A simple task tracking CLI tool"
dependencies = [
]

[project.scripts]
tasks = "task_tracker.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]